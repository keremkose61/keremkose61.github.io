<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#35E69A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#080B0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyberBorder" x1="0" y1="0" x2="200" y2="200">
      <stop stop-color="#35E69A"/>
      <stop offset="0.5" stop-color="#16221D"/>
      <stop offset="1" stop-color="#35E69A" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0" y1="0" x2="100" y2="100">
      <stop stop-color="#35E69A"/>
      <stop offset="1" stop-color="#8AFCD1"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="#101613"/>
  <circle cx="100" cy="100" r="90" fill="url(#avatarGlow)"/>
  <circle cx="100" cy="100" r="95" stroke="url(#cyberBorder)" stroke-width="2"/>
  
  <!-- Stylized Developer Silhouette with Cyber Headset & Code Symbol -->
  <circle cx="100" cy="80" r="34" fill="#1A2420" stroke="#35E69A" stroke-width="2"/>
  <path d="M50 165 C50 128 72 118 100 118 C128 118 150 128 150 165" fill="#151F1A" stroke="#35E69A" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Cyber Glasses / Visor -->
  <rect x="74" y="72" width="52" height="15" rx="7" fill="#080B0A" stroke="#35E69A" stroke-width="2"/>
  <line x1="82" y1="79.5" x2="118" y2="79.5" stroke="#35E69A" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
  
  <!-- Bracket Monogram badge -->
  <rect x="78" y="138" width="44" height="24" rx="6" fill="#080B0A" stroke="#35E69A" stroke-width="1.5"/>
  <text x="100" y="154" fill="#35E69A" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">&lt;KK/&gt;</text>
  
  <!-- Tech circuit nodes -->
  <circle cx="35" cy="65" r="3" fill="#35E69A" opacity="0.6"/>
  <line x1="35" y1="65" x2="55" y2="75" stroke="#35E69A" stroke-width="1" opacity="0.3"/>
  <circle cx="165" cy="65" r="3" fill="#35E69A" opacity="0.6"/>
  <line x1="165" y1="65" x2="145" y2="75" stroke="#35E69A" stroke-width="1" opacity="0.3"/>
</svg>